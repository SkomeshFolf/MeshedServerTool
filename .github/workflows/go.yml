name: Go

on:
  push:
    branches: [main, v3-dev]
  pull_request:
    branches: [main, v3-dev]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # The Go binary embeds web/dist via go:embed (see web/embed.go).
      # web/dist is gitignored, so we have to build it locally before
      # go vet / go test — otherwise the embed fails with
      # "pattern all:dist: no matching files found".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: gofmt
        # CI gate: any file with gofmt issues fails the build.
        # gofmt -l prints filenames needing reformatting; if any
        # are listed, fail.
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race)
        run: go test -race -count=1 -timeout=180s ./...

  build:
    name: cross-compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Cross-compile Windows
        env:
          CGO_ENABLED: 0
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/meshed

      - name: Cross-compile macOS (arm64)
        env:
          CGO_ENABLED: 0
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/meshed

      - name: Cross-compile Linux
        run: CGO_ENABLED=0 go build -o /tmp/meshed ./cmd/meshed

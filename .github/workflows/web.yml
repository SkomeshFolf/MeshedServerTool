name: Web

on:
  push:
    branches: [main, v3-dev]
  pull_request:
    branches: [main, v3-dev]

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check + build
        working-directory: web
        # `tsc --noEmit` would also work for pure type checking, but
        # `npm run build` runs Vite's full pipeline which includes
        # type errors and bundle size verification.
        run: npm run build

      - name: Verify embed
        # Sanity check: the produced bundle must contain the React
        # root mount and not include any source maps (H9 fix).
        run: |
          if find web/dist -name "*.map" | grep -q .; then
            echo "ERROR: web/dist contains a sourcemap file"
            find web/dist -name "*.map"
            exit 1
          fi
          if ! grep -q 'id="root"' web/dist/index.html; then
            echo "ERROR: web/dist/index.html missing the React root mount"
            exit 1
          fi
          echo "Bundle size: $(du -sh web/dist | cut -f1)"
